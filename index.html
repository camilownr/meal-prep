<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Meal Prep</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meal Prep">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* VOICE everyday, practical, calm, zero fluff
   IDEA a clean prep card taped to the fridge, held in one hand
   PICTURE the working checklist itself: big thumb rows, progress always in view
   COLOUR light only: white ground, warm-grey surfaces, one basil-green accent for everything active
   TYPE Barlow Condensed signage + Inter
   LAYOUT phone first: slim header, sticky progress, one column, bottom tab bar in thumb reach */
:root,:root[data-theme=dark],:root[data-theme=light]{color-scheme:light;--bg:#ffffff;--card:#f4f4f2;--ink:#1c1f1d;--mute:#6b706c;--line:#e6e7e4;--a:#2e6e4e;--a-soft:#e7f0ea;--red:var(--a);--fr:var(--a);--mi:var(--a);--ab:var(--a);--ok:var(--a);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 Inter,system-ui,sans-serif;overflow-x:clip;touch-action:manipulation}
h1,h2,h3{font-family:"Barlow Condensed",Inter,sans-serif;line-height:1.05;margin:0;letter-spacing:.2px}
button{font:inherit;color:inherit}
button:focus-visible,label:focus-within,a:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.top{background:var(--bg);color:var(--ink);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 14px) max(5vw,16px,env(safe-area-inset-right,0px)) 12px max(5vw,16px,env(safe-area-inset-left,0px))}
.top h1{font-size:36px}
.top p{margin:2px 0 0;color:var(--mute);font-size:15px}
main{max-width:640px;margin:0 auto;padding:0 max(4vw,14px) calc(110px + var(--safe-b))}
.sticky{position:sticky;top:0;z-index:4;background:var(--bg);padding:12px 0 10px}
.sum{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sum b{font:700 30px "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.sum span{color:var(--mute);font-size:15px}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .3s}
.portions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.pc{background:var(--card);border-radius:14px;padding:8px 6px 6px;text-align:center}
.pc small{display:block;font-size:13px;color:var(--mute);font-weight:500}
.step{display:flex;align-items:center;justify-content:space-between;gap:2px}
.step b{font:700 28px "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;min-width:26px}
.ib{width:44px;height:44px;border-radius:12px;border:0;background:var(--bg);font-size:24px;font-weight:600;line-height:1;cursor:pointer;display:grid;place-items:center}
.ib:active{transform:scale(.92)}
.sec{display:flex;align-items:baseline;gap:8px;margin:22px 0 4px;font-size:25px}
.sec span{font:500 14px Inter,sans-serif;color:var(--mute)}
ul{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--line);min-height:62px;cursor:pointer;user-select:none;transition:opacity .22s,transform .22s}
.row:active{background:var(--card)}
.row.out{opacity:0;transform:translateX(40px)}
.row input{appearance:none;-webkit-appearance:none;flex:none;width:30px;height:30px;border:2px solid var(--mute);border-radius:9px;display:grid;place-items:center;margin:0;cursor:pointer;background:var(--bg)}
.row input:checked{background:var(--k,var(--ok));border-color:var(--k,var(--ok))}
.row input:checked::after{content:"";width:8px;height:15px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.nm{flex:1;font-weight:500}
.nm small{display:block;font-weight:400;color:var(--mute);font-size:14px;line-height:1.3;margin-top:2px}
.amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;text-align:right}
.done .nm,.done .amt{text-decoration:line-through;color:var(--mute)}
.empty{text-align:center;padding:40px 10px;color:var(--mute)}
.empty b{display:block;font:700 34px "Barlow Condensed",sans-serif;color:var(--ok);margin-bottom:4px}
details{margin-top:18px;border-radius:14px;background:var(--card);padding:0 12px}
summary{cursor:pointer;font-weight:600;min-height:52px;display:flex;align-items:center;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"";margin-left:auto;width:9px;height:9px;border:solid var(--mute);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .2s}
details[open] summary::after{transform:rotate(-135deg)}
.cart .row{opacity:.7}
.txt{background:none;border:0;color:var(--red);font-weight:600;font-size:15px;min-height:44px;padding:0 4px;cursor:pointer}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--card);border-radius:14px;padding:4px}
.seg button{border:0;border-radius:11px;min-height:46px;background:none;font-weight:600;font-size:15px;cursor:pointer;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mhead{background:var(--card);color:var(--ink);border-radius:18px;padding:14px 16px;margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mhead h2{font-size:30px}
.mhead p{margin:2px 0 0;color:var(--mute);font-size:15px}
.mhead .step{background:var(--bg);border-radius:14px;padding:3px}
.mhead .ib{background:var(--card)}
.mhead .step b{color:var(--ink);font-size:32px;min-width:34px;text-align:center}
.mhead .step small{display:block;font-size:12px;text-align:center;color:var(--mute);margin-top:2px}
.prep li{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.prep li:active{background:var(--card)}
.prep .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 19px "Barlow Condensed",sans-serif}
.prep li.done{color:var(--mute)}
.prep li.done span{text-decoration:line-through}
.prep li.done .n{background:var(--line);color:var(--mute)}
.acts{display:flex;justify-content:space-between;flex-wrap:wrap;margin-top:6px}
.note{font-size:13px;color:var(--mute);text-align:center;margin-top:28px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px max(4vw,14px,calc((100vw - 640px)/2)) calc(8px + var(--safe-b))}
nav.tabs a{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;text-decoration:none;color:var(--mute);font-weight:600;font-size:16px}
nav.tabs a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current=page]{background:var(--a-soft);color:var(--a)}
nav.tabs .badge{font:600 13px Inter,sans-serif;background:var(--a);color:#fff;border-radius:20px;padding:1px 7px}
nav.tabs a:not([aria-current]) .badge{background:var(--card);color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:7;background:var(--ink);color:var(--bg);border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:10px;font-size:15px;max-width:calc(100vw - 28px);transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{border:0;background:none;color:#fff;text-decoration:underline;font-weight:600;min-height:44px;padding:0 12px;cursor:pointer;flex:none}
/* Heute: Wasser + Abhaken */
.dnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dnav b{font:700 26px "Barlow Condensed",sans-serif;text-align:center;flex:1}
.dnav b small{display:block;font:500 13px Inter,sans-serif;color:var(--mute)}
.dnav .ib{background:var(--card)}
.dnav .ib:disabled{opacity:.3;cursor:default}
.wcard{background:var(--card);border-radius:18px;padding:16px;margin-top:6px}
.whead{display:flex;align-items:center;gap:16px}
.ring{flex:none;width:118px;height:118px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11}
.ring .bgc{stroke:var(--line)}
.ring .fgc{stroke:var(--a);stroke-linecap:round;transition:stroke-dashoffset .35s}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring div b{font:700 30px "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;line-height:1}
.ring div small{font-size:13px;color:var(--mute)}
.winfo h2{font-size:28px}
.winfo p{margin:2px 0 0;color:var(--mute);font-size:15px}
.wbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.wbtn{border:0;border-radius:14px;background:var(--bg);min-height:64px;cursor:pointer;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px}
.wbtn svg{width:26px;height:26px;fill:none;stroke:var(--a);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wbtn small{display:block;font-weight:500;color:var(--mute);font-size:13px}
.wbtn:active{transform:scale(.97)}
.gsz{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--mute)}
.gsz button{border:1px solid var(--line);background:var(--bg);border-radius:20px;min-height:36px;padding:0 10px;font-size:14px;font-weight:600;cursor:pointer;color:var(--mute)}
.gsz button[aria-pressed=true]{border-color:var(--a);color:var(--a);background:var(--a-soft)}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);cursor:pointer}
.trow span{font-weight:600}
.trow span small{display:block;font-weight:400;color:var(--mute);font-size:14px}
.trow:focus-within{outline:none}.trow:has(.sw:focus-visible){outline:3px solid var(--a);outline-offset:2px}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:52px;height:32px;border-radius:20px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw:checked{background:var(--a)}
.sw:checked::after{transform:translateX(20px)}
.wlog{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.wlog span{background:var(--bg);border-radius:20px;padding:3px 10px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:14px;align-items:end}
.week button{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mute)}
.week i{display:block;width:100%;max-width:30px;height:46px;border-radius:8px;background:var(--line);position:relative;overflow:hidden}
.week i em{position:absolute;left:0;right:0;bottom:0;background:var(--a);opacity:.85}
.week button[aria-current=date]{color:var(--ink);font-weight:700}
.badge.t{background:var(--a)}
[hidden]{display:none!important}
@media(min-width:700px){.top h1{font-size:42px}}
@media(prefers-reduced-motion:reduce){.row,.bar i,.toast,summary::after,.ring .fgc,.sw,.sw::after{transition:none}}
</style>
</head>
<body>
<header class="top"><h1>Meal Prep</h1><p id="sub">Wasser, Supplements &amp; Hautpflege</p></header>
<main>
<section id="v-heute">
  <div class="sticky"><div class="dnav"><button class="ib" type="button" id="dPrev" aria-label="Vorheriger Tag">‹</button><b id="dLbl"></b><button class="ib" type="button" id="dNext" aria-label="Nächster Tag">›</button></div></div>
  <div class="wcard">
    <div class="whead">
      <div class="ring" aria-hidden="true"><svg viewBox="0 0 120 120"><circle class="bgc" cx="60" cy="60" r="52"/><circle class="fgc" id="wRing" cx="60" cy="60" r="52" stroke-dasharray="326.73" stroke-dashoffset="326.73"/></svg><div><b id="wPct">0 %</b><small>vom Ziel</small></div></div>
      <div class="winfo"><h2 id="wNum">0 / 3,4 L</h2><p id="wTxt"></p></div>
    </div>
    <div class="wbtns">
      <button class="wbtn" type="button" id="addGlas"><svg viewBox="0 0 24 24"><path d="M6 3h12l-1.6 17a1 1 0 0 1-1 .9H8.6a1 1 0 0 1-1-.9z"/><path d="M6.6 9h10.8"/></svg><span>+ Glas<small id="glasLbl">0,25 L</small></span></button>
      <button class="wbtn" type="button" id="addFl"><svg viewBox="0 0 24 24"><path d="M10 2h4v3l2 3v12a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V8l2-3z"/><path d="M8 12h8"/></svg><span>+ Flasche<small>1,5 L</small></span></button>
    </div>
    <div class="gsz" id="gsz"></div>
    <div class="wlog" id="wLog"></div>
    <label class="trow"><span id="trLbl">Trainingstag<small>+1 L fürs Training</small></span><input type="checkbox" class="sw" id="trSw"></label>
    <div class="acts"><button class="txt" type="button" id="wUndo">Letzten Eintrag entfernen</button></div>
  </div>
  <div class="week" id="week" aria-label="Wasser der letzten 7 Tage"></div>
  <div id="chk"></div>
</section>
<section id="v-einkauf" hidden>
  <div class="sticky">
    <div class="sum"><b id="progNum">0 / 0</b><span id="progTxt">im Wagen</span></div>
    <div class="bar"><i id="barFill" style="width:0"></i></div>
  </div>
  <div class="portions" id="shopSteps"></div>
  <div id="shopList"></div>
  <div class="acts"><button class="txt" id="resetShop" type="button">Liste zurücksetzen</button></div>
</section>
<section id="v-mahlzeiten" hidden>
  <div class="sticky"><div class="seg" id="seg"></div></div>
  <div id="meal"></div>
</section>
<p class="note">Mengen nach deinem Meal-Prep-Plan. Wasser und Häkchen werden nur in diesem Browser gespeichert.</p>
</main>
<nav class="tabs" aria-label="Ansicht">
  <a href="#heute" id="t-heute"><svg viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>Heute <span class="badge" id="badgeT">0</span></a>
  <a href="#einkauf" id="t-einkauf"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h10.2L20 7H6.2"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg>Einkauf <span class="badge" id="badge">0</span></a>
  <a href="#mahlzeiten" id="t-mahlzeiten"><svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M12 3v4M8 5v2M16 5v2"/></svg>Kochen</a>
</nav>
<div class="toast" id="toast" role="status"><span id="toastTxt"></span><button type="button" id="undo">Rückgängig</button></div>
<script>
{
const SECT=[['obst','Obst'],['gemuese','Gemüse'],['fleisch','Fleisch'],['kuehl','Kühlregal'],['getreide','Nudeln, Reis & Getreide'],['konserven','Konserven'],['nuesse','Nüsse & Samen'],['suess','Honig & Süßes'],['oel','Öl'],['gewuerze','Gewürze']];
const nf=(x,d=1)=>x.toLocaleString('de-AT',{maximumFractionDigits:d});
const ING={
 banane:{n:'Bananen (groß)',s:'obst',u:'Stück'},
 heidelbeeren:{n:'Heidelbeeren',s:'obst',u:'g',h:()=>'frisch oder TK'},
 kiwi:{n:'Kiwi',s:'obst',u:'Stück'},
 kartoffeln:{n:'Kartoffeln',s:'gemuese',u:'g'},
 karotten:{n:'Karotten',s:'gemuese',u:'g'},
 paprika:{n:'Rote Paprika',s:'gemuese',u:'g'},
 brokkoli:{n:'Brokkoli',s:'gemuese',u:'g'},
 zwiebel:{n:'Zwiebeln',s:'gemuese',u:'Stück'},
 knoblauch:{n:'Knoblauch',s:'gemuese',u:'Zehen',h:q=>'≈ '+Math.ceil(q/10)+' Knolle'},
 haehnchen:{n:'Hähnchenbrust',s:'fleisch',u:'g'},
 skyr:{n:'Skyr',s:'kuehl',u:'g'},
 parmesan:{n:'Parmesan',s:'kuehl',u:'g'},
 ei:{n:'Eier',s:'kuehl',u:'Stück'},
 hafer:{n:'Haferflocken',s:'getreide',u:'g'},
 reis:{n:'Basmatireis (trocken)',s:'getreide',u:'g'},
 nudeln:{n:'Nudeln (trocken)',s:'getreide',u:'g'},
 bohnen:{n:'Kidneybohnen',s:'konserven',u:'g',d:240,du:['Dose','Dosen'],h:(q,shop)=>shop?nf(Math.round(q))+' g abgetropft · Dose 420 g (240 g abgetropft)':'abgetropft · ≈ '+nf(q/240,1)+' Dosen'},
 tomaten:{n:'Passierte Tomaten',s:'konserven',u:'g',d:500,du:['Packung','Packungen'],h:(q,shop)=>shop?nf(Math.round(q))+' g · Packung à 500 g':'≈ '+nf(q/500,1)+' Packungen à 500 g'},
 mandeln:{n:'Mandeln',s:'nuesse',u:'g'},
 kuerbis:{n:'Kürbiskerne',s:'nuesse',u:'g'},
 lein:{n:'Leinsamen, geschrotet',s:'nuesse',u:'g'},
 sonnen:{n:'Sonnenblumenkerne',s:'nuesse',u:'g'},
 honig:{n:'Honig',s:'suess',u:'g'},
 oel:{n:'Olivenöl',s:'oel',u:'g'},
 kreuz:{n:'Kreuzkümmel',s:'gewuerze'},
 paprikap:{n:'Paprikapulver (edelsüß + geräuchert)',s:'gewuerze'},
 chili:{n:'Chili',s:'gewuerze'},
 basilikum:{n:'Basilikum',s:'gewuerze'},
 oregano:{n:'Oregano',s:'gewuerze'},
 pfeffer:{n:'Pfeffer',s:'gewuerze'},
 salz:{n:'Jodsalz',s:'gewuerze'}
};
const MEALS=[
 {id:'fr',name:'Frühstück',short:'Frühstück',dish:'Skyr-Hafer-Shake',cook:1,shop:5,
  items:[['hafer',75],['skyr',250],['banane',2],['heidelbeeren',100],['honig',30],['mandeln',25],['kuerbis',15],['lein',10],['sonnen',15],['kiwi',1]],
  steps:['Alle Zutaten in den Mixer geben.','Mit Wasser zur gewünschten Konsistenz mixen.']},
 {id:'mi',name:'Mittagessen',short:'Mittag',dish:'Chicken-Chili mit Kartoffeln und Reis',cook:2,shop:5,
  items:[['haehnchen',135],['bohnen',150],['kartoffeln',250],['reis',100],['tomaten',1000/3],['karotten',80],['paprika',80],['oel',13.5],['zwiebel',.5],['knoblauch',1],['kreuz'],['paprikap'],['chili'],['pfeffer'],['salz']],
  steps:['Hähnchen würfeln, Kartoffeln und Karotten würfeln, Paprika und Zwiebel schneiden.','Hähnchen im Olivenöl portionsweise anbraten, Zwiebel und Knoblauch kurz mitbraten.','Kartoffeln, Karotten, Paprika, passierte Tomaten und etwas Wasser dazugeben und würzen.','15–25 Minuten köcheln, bis die Kartoffeln weich sind und das Hähnchen durchgegart ist.','Kidneybohnen in den letzten 5–10 Minuten dazugeben.','Reis separat kochen, alles gleichmäßig portionieren.']},
 {id:'ab',name:'Abendessen',short:'Abend',dish:'Mediterrane Chicken-Pasta',cook:2,shop:5,
  items:[['haehnchen',135],['nudeln',150],['tomaten',1000/3],['brokkoli',100],['paprika',100],['karotten',100],['parmesan',25],['ei',1],['oel',20],['knoblauch',1],['basilikum'],['oregano'],['pfeffer'],['salz']],
  steps:['Nudeln bissfest kochen, etwas Nudelwasser aufheben.','Hähnchen würfeln und im Olivenöl anbraten.','Karotten, Paprika und Brokkoli dazugeben und einige Minuten garen.','Passierte Tomaten und Knoblauch einrühren, würzen.','Parmesan und etwas Nudelwasser einrühren, bis die Sauce cremig ist.','Nudeln unterheben und portionieren.','Pro Portion 1 Ei dazu.']}
];
const KEY='mealprep-v1';
let st={shop:{},cook:{},bought:{},done:{},steps:{},meal:'mi'};
MEALS.forEach(m=>{st.shop[m.id]=m.shop;st.cook[m.id]=m.cook;st.done[m.id]={};st.steps[m.id]={}});
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)st={...st,...s,done:{...st.done,...(s.done||{})},steps:{...st.steps,...(s.steps||{})}}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const $=id=>document.getElementById(id);
const meal=id=>MEALS.find(m=>m.id===id);

function amt(id,q,shop){
 const u=ING[id].u;if(q==null||!u)return'';
 if(shop&&ING[id].d){const n=Math.ceil(q/ING[id].d);return n+' '+ING[id].du[n===1?0:1]}
 if(u==='g')return q>=1000?nf(q/1000,2)+' kg':(q>=100?nf(Math.round(q)):nf(Math.round(q*10)/10))+' g';
 const v=shop?Math.ceil(q):q;return nf(v)+' '+u;
}
function totals(){
 const t={};
 MEALS.forEach(m=>{const n=st.shop[m.id];if(!n)return;
  m.items.forEach(([id,q])=>{if(q==null){if(!(id in t))t[id]=null}else t[id]=(t[id]||0)+q*n})});
 return t;
}
function row(id,q,attr,checked,shop){
 const h=ING[id].h&&q!=null?ING[id].h(q,shop):'';
 return `<li><label class="row${checked?' done':''}"><input type="checkbox" ${attr} ${checked?'checked':''}><span class="nm">${ING[id].n}${h?`<small>${h}</small>`:''}</span><span class="amt">${amt(id,q,shop)}</span></label></li>`;
}
function stepper(attrD,attrI,val,label){
 return `<div class="step"><button class="ib" type="button" ${attrD} aria-label="${label} weniger">−</button><b>${val}</b><button class="ib" type="button" ${attrI} aria-label="${label} mehr">+</button></div>`;
}
function renderShop(){
 $('shopSteps').innerHTML=MEALS.map(m=>`<div class="pc" style="--c:var(--${m.id})">${stepper(`data-sd="${m.id}"`,`data-si="${m.id}"`,st.shop[m.id],m.name)}<small>${m.short} · Tage</small></div>`).join('');
 const t=totals(),ids=Object.keys(t),open=ids.filter(i=>!st.bought[i]),got=ids.filter(i=>st.bought[i]);
 let html=SECT.map(([s,label])=>{
  const its=open.filter(i=>ING[i].s===s);if(!its.length)return'';
  return `<h2 class="sec">${label}<span>${its.length}</span></h2><ul>${its.map(i=>row(i,t[i],`data-buy="${i}"`,false,true)).join('')}</ul>`;
 }).join('');
 if(!ids.length)html='<div class="empty">Keine Portionen ausgewählt.</div>';
 else if(!open.length)html='<div class="empty"><b>Alles im Wagen</b>Einkauf erledigt.</div>';
 if(got.length)html+=`<details class="cart"><summary>Im Wagen (${got.length}) – antippen zum Zurückholen</summary><ul>${got.map(i=>row(i,t[i],`data-unbuy="${i}"`,true,true)).join('')}</ul></details>`;
 $('shopList').innerHTML=html;
 $('barFill').style.width=(ids.length?got.length/ids.length*100:0)+'%';
 $('progNum').textContent=`${got.length} / ${ids.length}`;
 $('progTxt').textContent=open.length?`noch ${open.length} offen`:'fertig';
 $('badge').textContent=open.length;
}
function renderSeg(){
 $('seg').innerHTML=MEALS.map(m=>`<button type="button" data-meal="${m.id}" style="--c:var(--${m.id})" aria-pressed="${st.meal===m.id}">${m.short}</button>`).join('');
}
function renderMeal(){
 const m=meal(st.meal)||MEALS[0],n=st.cook[m.id],sd=st.steps[m.id]||{};
 const doneN=Object.keys(st.done[m.id]).length;
 $('meal').innerHTML=`<div class="mhead" style="--c:var(--${m.id})"><div><h2>${m.name}</h2><p>${m.dish}</p></div><div>${stepper(`data-cd="${m.id}"`,`data-ci="${m.id}"`,n,'Portionen')}<small>Portionen</small></div></div>
 <h2 class="sec">Zutaten<span>${doneN} von ${m.items.length} bereit</span></h2>
 <ul style="--k:var(--${m.id})">${m.items.map(([id,q])=>row(id,q==null?null:q*n,`data-done="${m.id}:${id}"`,!!st.done[m.id][id],false)).join('')}</ul>
 <h2 class="sec">Zubereitung<span>antippen zum Abhaken</span></h2>
 <ol class="prep" style="--c:var(--${m.id});padding:0;margin:0">${m.steps.map((s,i)=>`<li class="${sd[i]?'done':''}" data-st="${m.id}:${i}" tabindex="0" role="checkbox" aria-checked="${!!sd[i]}"><span class="n">${i+1}</span><span>${s}</span></li>`).join('')}</ol>
 <div class="acts"><button class="txt" type="button" data-reset="${m.id}">Häkchen zurücksetzen</button></div>`;
 $('sub').textContent=m.dish;
}
let undoFn=null,tmr=0;
function toast(msg,fn){
 undoFn=fn;$('toastTxt').textContent=msg;$('toast').classList.add('on');
 clearTimeout(tmr);tmr=setTimeout(()=>{$('toast').classList.remove('on');undoFn=null},4000);
}
const rm=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
document.addEventListener('click',e=>{
 const li=e.target.closest('[data-st]');
 if(li){const[m,i]=li.dataset.st.split(':');st.steps[m]=st.steps[m]||{};if(st.steps[m][i])delete st.steps[m][i];else st.steps[m][i]=1;save();renderMeal();return}
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.sd||d.si){const id=d.sd||d.si;st.shop[id]=Math.max(0,Math.min(14,st.shop[id]+(d.si?1:-1)));save();renderShop()}
 if(d.cd||d.ci){const id=d.cd||d.ci;st.cook[id]=Math.max(1,Math.min(7,st.cook[id]+(d.ci?1:-1)));save();renderMeal()}
 if(d.meal){st.meal=d.meal;save();renderSeg();renderMeal();window.scrollTo({top:0,behavior:rm()?'auto':'smooth'})}
 if(d.reset){const prev={done:st.done[d.reset],steps:st.steps[d.reset]};st.done[d.reset]={};st.steps[d.reset]={};save();renderMeal();toast('Häkchen zurückgesetzt',()=>{st.done[d.reset]=prev.done;st.steps[d.reset]=prev.steps;save();renderMeal()})}
 if(b.id==='resetShop'){const prev=st.bought;st.bought={};save();renderShop();toast('Liste zurückgesetzt',()=>{st.bought=prev;save();renderShop()})}
 if(b.id==='undo'&&undoFn){const f=undoFn;undoFn=null;$('toast').classList.remove('on');f()}
});
document.addEventListener('keydown',e=>{const li=e.target.closest&&e.target.closest('[data-st]');if(li&&(e.key===' '||e.key==='Enter')){e.preventDefault();li.click()}});
document.addEventListener('change',e=>{
 const d=e.target.dataset||{};
 if(d.buy){const id=d.buy;e.target.closest('.row').classList.add('out');st.bought[id]=1;save();setTimeout(renderShop,rm()?0:220);toast(ING[id].n+' im Wagen',()=>{delete st.bought[id];save();renderShop()})}
 if(d.unbuy){delete st.bought[d.unbuy];save();renderShop()}
 if(d.done){const[m,id]=d.done.split(':');if(e.target.checked)st.done[m][id]=1;else delete st.done[m][id];save();e.target.closest('.row').classList.toggle('done',e.target.checked);const s=document.querySelector('#meal .sec span');if(s)s.textContent=`${Object.keys(st.done[m]).length} von ${meal(m).items.length} bereit`}
});
/* ---------- Heute: Wasser, Supplements, Hautpflege ---------- */
const TKEY='mealprep-tag-v1',BASE=3400,EXTRA=1000,FL=1500,GL=[200,250,300,400];
const TRAIN={0:'Push Day',3:'Upper Day',5:'Leg Day',6:'Pull Day'};
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'],WDL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
let td={glass:250,days:{}};
try{const s=JSON.parse(localStorage.getItem(TKEY));if(s)td={...td,...s,days:s.days||{}}}catch(e){}
const tsave=()=>{const ks=Object.keys(td.days).sort();ks.slice(0,Math.max(0,ks.length-90)).forEach(k=>delete td.days[k]);try{localStorage.setItem(TKEY,JSON.stringify(td))}catch(e){}};
const noon=d=>{const x=new Date(d);x.setHours(12,0,0,0);return x};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
let cur=noon(new Date());
const dget=k=>td.days[k]||{log:[],chk:{}};
const dset=k=>td.days[k]||(td.days[k]={log:[],chk:{}});
const isTrain=d=>{const x=dget(iso(d));return x.train!=null?x.train:(d.getDay() in TRAIN)};
const goalOf=d=>BASE+(isTrain(d)?EXTRA:0);
const ml=d=>dget(iso(d)).log.reduce((a,b)=>a+b,0);
const L=v=>nf(v/1000,2)+' L';
function tasksOf(d){
 const t=[['omega','Omega-3','zu einer Mahlzeit','Supplements'],['d3','Vitamin D3','zu einer Mahlzeit mit etwas Fett','Supplements'],['mag','Magnesium','am Abend','Supplements']];
 if(d.getDay()===3)t.push(['tret','Tretinoin-Creme','Mittwoch · abends auf trockene Haut','Hautpflege']);
 if(d.getDay()===6)t.push(['azel','Azelainsäure','Samstag','Hautpflege']);
 return t;
}
function renderHeute(){
 const k=iso(cur),today=iso(noon(new Date())),x=dget(k),tr=isTrain(cur),g=goalOf(cur),m=ml(cur),p=Math.min(1,m/g);
 const diff=Math.round((noon(new Date())-cur)/864e5);
 $('dLbl').innerHTML=(diff===0?'Heute':diff===1?'Gestern':diff===-1?'Morgen':WDL[cur.getDay()])+`<small>${WD[cur.getDay()]}, ${cur.toLocaleDateString('de-AT',{day:'numeric',month:'long'})}</small>`;
 $('dNext').disabled=k>=today;
 $('wRing').style.strokeDashoffset=(326.73*(1-p)).toFixed(2);$('wRing').style.opacity=m>0?1:0;
 $('wPct').textContent=Math.round(m/g*100)+' %';
 $('wNum').textContent=nf(m/1000,2)+' / '+nf(g/1000,1)+' L';
 $('wTxt').textContent=m>=g?'Ziel erreicht 💧':'noch '+L(g-m)+(tr?' · inkl. 1 L Training':'');
 $('glasLbl').textContent=nf(td.glass/1000,2)+' L';
 $('gsz').innerHTML='Glas:'+GL.map(v=>`<button type="button" data-gl="${v}" aria-pressed="${td.glass===v}">${nf(v/1000,2)} L</button>`).join('');
 $('wLog').innerHTML=x.log.map(v=>`<span>${v===FL?'Flasche':'Glas'} ${nf(v/1000,2)} L</span>`).join('');
 $('trSw').checked=tr;
 $('trLbl').innerHTML=(tr&&TRAIN[cur.getDay()]?'Trainingstag · '+TRAIN[cur.getDay()]:'Trainingstag')+'<small>+1 L fürs Training (Ziel '+nf((BASE+EXTRA)/1000,1)+' L statt '+nf(BASE/1000,1)+' L)</small>';
 $('wUndo').hidden=!x.log.length;
 let w='';for(let i=6;i>=0;i--){const d=addD(noon(new Date()),-i),q=Math.min(1,ml(d)/goalOf(d));w+=`<button type="button" data-day="${iso(d)}" ${iso(d)===k?'aria-current="date"':''} aria-label="${WDL[d.getDay()]}: ${L(ml(d))}"><i><em style="height:${q*100}%"></em></i>${WD[d.getDay()]}</button>`}
 $('week').innerHTML=w;
 const ts=tasksOf(cur);let h='';
 ['Supplements','Hautpflege'].forEach(sec=>{const its=ts.filter(t=>t[3]===sec);if(!its.length)return;const dn=its.filter(t=>x.chk[t[0]]).length;
  h+=`<h2 class="sec">${sec}<span>${dn} von ${its.length}</span></h2><ul>`+its.map(([id,n,hint])=>`<li><label class="row${x.chk[id]?' done':''}"><input type="checkbox" data-tk="${id}" ${x.chk[id]?'checked':''}><span class="nm">${n}<small>${hint}</small></span></label></li>`).join('')+'</ul>'});
 $('chk').innerHTML=h;
 const open=tasksOf(noon(new Date())).filter(t=>!dget(today).chk[t[0]]).length;
 $('badgeT').textContent=open;
}
function addWater(v){const k=iso(cur),before=ml(cur),g=goalOf(cur);dset(k).log.push(v);tsave();renderHeute();
 if(before<g&&before+v>=g)toast('Tagesziel erreicht 💧',()=>{dset(k).log.pop();tsave();renderHeute()});
 else toast('+ '+L(v)+' getrunken',()=>{dset(k).log.pop();tsave();renderHeute()})}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.id==='addGlas')addWater(td.glass);
 if(b.id==='addFl')addWater(FL);
 if(b.id==='wUndo'){const x=dset(iso(cur));const v=x.log.pop();tsave();renderHeute();if(v)toast(L(v)+' entfernt',()=>{x.log.push(v);tsave();renderHeute()})}
 if(b.dataset.gl){td.glass=+b.dataset.gl;tsave();renderHeute()}
 if(b.id==='dPrev'){cur=addD(cur,-1);renderHeute()}
 if(b.id==='dNext'&&!b.disabled){cur=addD(cur,1);renderHeute()}
 if(b.dataset.day){const[y,mo,da]=b.dataset.day.split('-');cur=new Date(+y,mo-1,+da,12);renderHeute()}
});
document.addEventListener('change',e=>{
 if(e.target.id==='trSw'){const k=iso(cur),def=cur.getDay() in TRAIN,x=dset(k);if(e.target.checked===def)delete x.train;else x.train=e.target.checked;tsave();renderHeute()}
 const tk=e.target.dataset&&e.target.dataset.tk;
 if(tk){const x=dset(iso(cur));if(e.target.checked)x.chk[tk]=1;else delete x.chk[tk];tsave();renderHeute()}
});
let lastToday=iso(noon(new Date()));
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;const n=noon(new Date());if(iso(n)!==lastToday){lastToday=iso(n);cur=n}renderHeute()});

function route(){
 const v=location.hash==='#mahlzeiten'?'mahlzeiten':location.hash==='#einkauf'?'einkauf':'heute';
 ['heute','einkauf','mahlzeiten'].forEach(x=>{$('v-'+x).hidden=x!==v;const t=$('t-'+x);if(x===v)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current')});
 if(v==='einkauf')$('sub').textContent='Einkaufsliste nach Abteilungen';else if(v==='heute'){$('sub').textContent='Wasser, Supplements & Hautpflege';renderHeute()}else renderMeal();
 window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
renderShop();renderSeg();renderMeal();renderHeute();route();
}
</script>
</body>
</html>
